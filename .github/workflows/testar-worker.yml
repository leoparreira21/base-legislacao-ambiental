name: verificar worker cloudflare
on:
  pull_request:
    paths:
      - 'cloudflare/legislacao-ambiental-api/**'
      - 'testes/worker-smoke.test.mjs'
      - 'testes/worker-contract.test.mjs'
      - '.github/workflows/testar-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do Worker
        run: node --check cloudflare/legislacao-ambiental-api/worker.mjs
      - name: Validar contrato JSON sem consumir IA
        run: node --test testes/worker-contract.test.mjs
      - name: Testar Worker publicado sem consumir IA
        run: node --test testes/worker-smoke.test.mjs
