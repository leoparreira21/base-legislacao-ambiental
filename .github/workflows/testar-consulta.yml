name: validar consulta hibrida (PR)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar a base
        run: python scripts/validar.py
      - name: Testar scripts e consultas
        run: python -m unittest discover -s testes -v
      - name: Gerar indices e site
        run: python scripts/gerar_site.py _site
      - name: Validar fontes, IDs e grafo
        run: python scripts/validar_indices.py _site
      - name: Testar motor
        run: node --test testes/motor.test.mjs
